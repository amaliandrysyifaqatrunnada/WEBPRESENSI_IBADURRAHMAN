<script>
        // Update Clock
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('dynamic-clock').textContent = `${hours}:${minutes}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Simulate Attendance Flow
        const absenBtn = document.getElementById('absen-btn');
        const finishBtn = document.getElementById('finish-btn');
        const successOverlay = document.getElementById('success-overlay');
        const closeSuccessBtn = document.getElementById('close-success-btn');

        absenBtn.addEventListener('click', () => {
            // Show loading state briefly
            absenBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Memproses...';
            absenBtn.classList.add('opacity-75', 'cursor-not-allowed');
            
            setTimeout(() => {
                // Show success overlay
                successOverlay.classList.remove('opacity-0', 'pointer-events-none');
                
                // Swap buttons behind overlay
                absenBtn.classList.add('hidden');
                finishBtn.classList.remove('hidden');
            }, 800);
        });

        closeSuccessBtn.addEventListener('click', () => {
            successOverlay.classList.add('opacity-0', 'pointer-events-none');
        });
    </script>
