<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 1520" width="950" height="1520" style="background:#ffffff; font-family:Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="950" height="1520" fill="#ffffff"/>

  <!-- Title (Formal) -->
  <text x="475" y="45" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">FLOWCHART ALUR KERJA SISTEM WEB PRESENSI</text>
  <text x="475" y="68" text-anchor="middle" font-size="12.5" fill="#333333">PKBM IBADURRAHMAN</text>
  <line x1="150" y1="85" x2="800" y2="85" stroke="#000000" stroke-width="1"/>

  <!-- ==================== 1. START & PORTAL ==================== -->
  <!-- Terminator: Mulai -->
  <rect x="400" y="105" width="150" height="42" rx="21" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="475" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Mulai</text>

  <!-- Line: Mulai -> Buka Web -->
  <line x1="475" y1="147" x2="475" y2="182" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Process: Akses Web -->
  <rect x="330" y="184" width="290" height="46" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="475" y="204" text-anchor="middle" font-size="11.5" fill="#000000">Buka Website Presensi</text>
  <text x="475" y="220" text-anchor="middle" font-size="10.5" fill="#555555">(Halaman Utama / Portal)</text>

  <!-- Line: Buka Web -> Decision Menu -->
  <line x1="475" y1="230" x2="475" y2="265" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision: Pilih Menu Portal -->
  <polygon points="475,267 575,305 475,343 375,305" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="475" y="301" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Pilih Menu</text>
  <text x="475" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Portal?</text>

  <!-- ==================== 3 CABANG DARI PORTAL ==================== -->
  <!-- Cabang 1: Guru (Kiri x=190) -->
  <path d="M 375 305 L 190 305 L 190 380" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="297" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#000000">[1] Menu Guru</text>

  <!-- Cabang 2: Layar QR (Tengah x=475) -->
  <line x1="475" y1="343" x2="475" y2="380" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="362" font-size="10.5" font-weight="bold" fill="#000000">[2] Layar QR</text>

  <!-- Cabang 3: Admin (Kanan x=760) -->
  <path d="M 575 305 L 760 305 L 760 380" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="680" y="297" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#000000">[3] Menu Admin</text>

  <!-- ==================== CABANG 1: GURU ==================== -->
  <!-- Input: Login Guru -->
  <polygon points="105,382 275,382 245,428 75,428" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="175" y="401" text-anchor="middle" font-size="11" fill="#000000">Input Email &amp; Password</text>
  <text x="175" y="416" text-anchor="middle" font-size="10" fill="#555555">(Login Guru)</text>

  <line x1="175" y1="428" x2="175" y2="458" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision: Cek Login Guru -->
  <polygon points="175,460 240,490 175,520 110,490" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="175" y="487" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">Login</text>
  <text x="175" y="499" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">Valid?</text>

  <!-- Login Salah (Loop back) -->
  <path d="M 110 490 L 55 490 L 55 405 L 85 405" fill="none" stroke="#000000" stroke-width="1.3" stroke-dasharray="3" marker-end="url(#arrow)"/>
  <text x="48" y="450" text-anchor="middle" font-size="9" font-weight="bold" fill="#000000">Tidak</text>

  <!-- Login Benar -->
  <line x1="175" y1="520" x2="175" y2="550" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="180" y="537" font-size="10" font-weight="bold" fill="#000000">Ya</text>

  <!-- Process: Dashboard Guru -->
  <rect x="90" y="552" width="170" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="175" y="576" text-anchor="middle" font-size="11" fill="#000000">Masuk Dashboard Guru</text>

  <line x1="175" y1="592" x2="175" y2="622" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision: Jenis Kehadiran -->
  <polygon points="175,624 245,655 175,686 105,655" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="175" y="651" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">Jenis</text>
  <text x="175" y="663" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">Presensi?</text>

  <!-- Sub-branch: Izin / Sakit (ke kiri) -->
  <path d="M 105 655 L 60 655 L 60 710" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="65" y="647" font-size="9.5" font-weight="bold" fill="#000000">Izin/Sakit</text>

  <polygon points="15,712 125,712 105,752 0,752" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="60" y="729" text-anchor="middle" font-size="9" fill="#000000">Form Izin &amp;</text>
  <text x="60" y="741" text-anchor="middle" font-size="9" fill="#555555">Upload Bukti</text>

  <path d="M 60 752 L 60 1150 L 175 1150" fill="none" stroke="#000000" stroke-width="1.3"/>

  <!-- Sub-branch: Hadir (ke bawah) -->
  <line x1="175" y1="686" x2="175" y2="720" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="180" y="705" font-size="10" font-weight="bold" fill="#000000">Hadir</text>

  <!-- Process: Scan QR / Selfie -->
  <rect x="95" y="722" width="160" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="175" y="740" text-anchor="middle" font-size="10" fill="#000000">Scan QR Code Sekolah</text>
  <text x="175" y="753" text-anchor="middle" font-size="9" fill="#555555">atau Ambil Selfie Wajah</text>

  <line x1="175" y1="764" x2="175" y2="794" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Input: Deteksi GPS -->
  <polygon points="105,796 265,796 240,836 80,836" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="172" y="813" text-anchor="middle" font-size="10" fill="#000000">Deteksi Koordinat GPS</text>
  <text x="172" y="825" text-anchor="middle" font-size="9" fill="#555555">(Perangkat Guru)</text>

  <line x1="172" y1="836" x2="172" y2="866" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision: Cek Radius GPS -->
  <polygon points="172,868 245,900 172,932 99,900" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="172" y="896" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#000000">Radius &lt;=</text>
  <text x="172" y="908" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#000000">50 Meter?</text>

  <!-- Tidak dalam radius -->
  <path d="M 99 900 L 70 900 L 70 950" fill="none" stroke="#000000" stroke-width="1.3" stroke-dasharray="3" marker-end="url(#arrow)"/>
  <text x="75" y="892" font-size="9" font-weight="bold" fill="#000000">Tidak</text>
  <rect x="25" y="952" width="105" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="77" y="968" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#000000">Presensi Ditolak</text>
  <text x="77" y="979" text-anchor="middle" font-size="7.5" fill="#555555">(Luar Radius)</text>

  <path d="M 77 986 L 77 1410 L 475 1410" fill="none" stroke="#000000" stroke-width="1.3"/>

  <!-- Ya dalam radius -->
  <line x1="172" y1="932" x2="172" y2="970" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="178" y="950" font-size="10" font-weight="bold" fill="#000000">Ya</text>

  <!-- Decision: Batas Waktu -->
  <polygon points="172,972 245,1004 172,1036 99,1004" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="172" y="1000" text-anchor="middle" font-size="9" font-weight="bold" fill="#000000">Waktu &lt;=</text>
  <text x="172" y="1012" text-anchor="middle" font-size="9" font-weight="bold" fill="#000000">Batas Masuk?</text>

  <!-- Waktu Ya / Tidak -->
  <path d="M 99 1004 L 75 1004 L 75 1050" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="80" y="996" font-size="8.5" font-weight="bold" fill="#000000">Ya</text>
  <rect x="40" y="1052" width="85" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="82" y="1071" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#000000">"Tepat Waktu"</text>

  <path d="M 245 1004 L 270 1004 L 270 1050" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="275" y="996" font-size="8.5" font-weight="bold" fill="#000000">Tidak</text>
  <rect x="230" y="1052" width="85" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="272" y="1071" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#000000">"Terlambat"</text>

  <!-- Konvergensi Status Presensi -->
  <path d="M 82 1082 L 82 1115 L 175 1115" fill="none" stroke="#000000" stroke-width="1.3"/>
  <path d="M 272 1082 L 272 1115 L 175 1115" fill="none" stroke="#000000" stroke-width="1.3"/>
  <line x1="175" y1="1115" x2="175" y2="1170" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Process: Simpan DB Presensi -->
  <rect x="95" y="1172" width="160" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="175" y="1191" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#000000">Simpan Data Presensi</text>
  <text x="175" y="1204" text-anchor="middle" font-size="9" fill="#555555">ke Database Cloud (MySQL)</text>

  <line x1="175" y1="1214" x2="175" y2="1248" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output: Notifikasi Sukses -->
  <polygon points="105,1250 265,1250 240,1292 80,1292" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="172" y="1268" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">Tampilkan Bukti Presensi</text>
  <text x="172" y="1281" text-anchor="middle" font-size="9" fill="#555555">&amp; Riwayat Kehadiran</text>

  <!-- ==================== CABANG 2: LAYAR QR ==================== -->
  <rect x="385" y="382" width="180" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="475" y="401" text-anchor="middle" font-size="10.5" fill="#000000">Buka Menu /qr-presensi</text>
  <text x="475" y="414" text-anchor="middle" font-size="9" fill="#555555">(Layar Monitor Sekolah)</text>

  <line x1="475" y1="424" x2="475" y2="464" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="385" y="466" width="180" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="475" y="485" text-anchor="middle" font-size="10.5" fill="#000000">Generate Token Dinamis</text>
  <text x="475" y="498" text-anchor="middle" font-size="9" fill="#555555">(Enkripsi Unik Acak)</text>

  <line x1="475" y1="508" x2="475" y2="548" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="385" y="550" width="180" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="475" y="569" text-anchor="middle" font-size="10.5" fill="#000000">Tampilkan QR di Monitor</text>
  <text x="475" y="582" text-anchor="middle" font-size="9" fill="#555555">(Siap Dipindai Guru)</text>

  <line x1="475" y1="592" x2="475" y2="632" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision: Timer QR -->
  <polygon points="475,634 545,665 475,696 405,665" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="475" y="661" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#000000">Timer 30 dtk</text>
  <text x="475" y="673" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#000000">Habis?</text>

  <!-- Loop back QR -->
  <path d="M 545 665 L 590 665 L 590 487 L 570 487" fill="none" stroke="#000000" stroke-width="1.3" stroke-dasharray="3" marker-end="url(#arrow)"/>
  <text x="595" y="580" font-size="9" font-weight="bold" fill="#000000">Ya (Rotasi)</text>

  <!-- QR Tidak Habis (Standby) -->
  <line x1="475" y1="696" x2="475" y2="736" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="718" font-size="9.5" font-weight="bold" fill="#000000">Tidak</text>
  <rect x="395" y="738" width="160" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="475" y="754" text-anchor="middle" font-size="9.5" fill="#000000">Standby Layar Monitor</text>
  <text x="475" y="765" text-anchor="middle" font-size="8.5" fill="#555555">(Anti Titip Absen Aktif)</text>

  <!-- ==================== CABANG 3: ADMIN ==================== -->
  <polygon points="695,382 865,382 835,428 665,428" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="765" y="401" text-anchor="middle" font-size="11" fill="#000000">Input Akun Administrator</text>
  <text x="765" y="416" text-anchor="middle" font-size="10" fill="#555555">(Email &amp; Password)</text>

  <line x1="765" y1="428" x2="765" y2="458" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision: Login Admin -->
  <polygon points="765,460 830,490 765,520 700,490" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="765" y="487" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">Login</text>
  <text x="765" y="499" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">Valid?</text>

  <!-- Loop back Admin -->
  <path d="M 830 490 L 880 490 L 880 405 L 850 405" fill="none" stroke="#000000" stroke-width="1.3" stroke-dasharray="3" marker-end="url(#arrow)"/>
  <text x="885" y="450" font-size="9" font-weight="bold" fill="#000000">Tidak</text>

  <line x1="765" y1="520" x2="765" y2="550" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="770" y="537" font-size="10" font-weight="bold" fill="#000000">Ya</text>

  <rect x="680" y="552" width="170" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="765" y="576" text-anchor="middle" font-size="11" fill="#000000">Dashboard Monitoring Admin</text>

  <line x1="765" y1="592" x2="765" y2="632" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="675" y="634" width="180" height="52" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="765" y="652" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">Manajemen Data &amp; Setting:</text>
  <text x="765" y="666" text-anchor="middle" font-size="9" fill="#555555">• Data Guru (CRUD / Excel)</text>
  <text x="765" y="678" text-anchor="middle" font-size="9" fill="#555555">• Koordinat GPS &amp; Jam Masuk</text>

  <line x1="765" y1="686" x2="765" y2="726" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polygon points="695,728 860,728 835,770 670,770" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="765" y="746" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">Cetak Laporan Rekapitulasi</text>
  <text x="765" y="759" text-anchor="middle" font-size="9" fill="#555555">(Format PDF / Excel)</text>

  <!-- ==================== CONVERGENCE TO SELESAI ==================== -->
  <!-- Line from Guru Output -->
  <path d="M 172 1292 L 172 1360 L 475 1360" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- Line from Layar QR Standby -->
  <path d="M 475 772 L 475 1360" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- Line from Admin Laporan -->
  <path d="M 765 770 L 765 1360 L 475 1360" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- Down into Selesai -->
  <line x1="475" y1="1360" x2="475" y2="1425" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Terminator: Selesai -->
  <rect x="400" y="1427" width="150" height="42" rx="21" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="475" y="1453" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Selesai</text>

</svg>
