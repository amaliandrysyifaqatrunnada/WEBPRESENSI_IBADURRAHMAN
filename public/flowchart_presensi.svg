<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1620" width="1100" height="1620" style="background:#ffffff; font-family:Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="1620" fill="#ffffff"/>

  <!-- Document Title Box -->
  <rect x="40" y="30" width="1020" height="60" fill="#f8fafc" stroke="#000000" stroke-width="1.5"/>
  <text x="550" y="56" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">FLOWCHART ALUR KERJA SISTEM PRESENSI</text>
  <text x="550" y="76" text-anchor="middle" font-size="13" font-weight="normal" fill="#333333">PKBM IBADURRAHMAN BERBASIS WEB</text>

  <!-- ==================== SWIMLANE HEADERS ==================== -->
  <!-- Header Guru -->
  <rect x="40" y="90" width="340" height="40" fill="#f1f5f9" stroke="#000000" stroke-width="1.5"/>
  <text x="210" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Guru / Tenaga Pendidik</text>

  <!-- Header Sistem -->
  <rect x="380" y="90" width="420" height="40" fill="#f1f5f9" stroke="#000000" stroke-width="1.5"/>
  <text x="590" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Sistem Web Presensi (Cloud)</text>

  <!-- Header Admin -->
  <rect x="800" y="90" width="260" height="40" fill="#f1f5f9" stroke="#000000" stroke-width="1.5"/>
  <text x="930" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Administrator</text>

  <!-- Swimlane Outer Bounds & Vertical Separators -->
  <rect x="40" y="130" width="1020" height="1440" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line x1="380" y1="130" x2="380" y2="1570" stroke="#000000" stroke-width="1.5"/>
  <line x1="800" y1="130" x2="800" y2="1570" stroke="#000000" stroke-width="1.5"/>

  <!-- ==================== FLOWCHART ELEMENTS ==================== -->

  <!-- 1. START (Guru) -->
  <rect x="135" y="150" width="150" height="42" rx="21" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="210" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Mulai</text>

  <!-- Line: Start -> Input Login -->
  <line x1="210" y1="192" x2="210" y2="222" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. Input Login (Parallelogram) -->
  <polygon points="120,224 315,224 285,274 90,274" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="202" y="246" text-anchor="middle" font-size="11.5" fill="#000000">Input Email &amp; Password</text>
  <text x="202" y="262" text-anchor="middle" font-size="11" fill="#333333">(Login Guru)</text>

  <!-- Line: Guru Login -> Sistem Validasi -->
  <path d="M 300 249 L 590 249 L 590 295" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. Proses Validasi Akun (Sistem) -->
  <rect x="490" y="297" width="200" height="45" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="590" y="324" text-anchor="middle" font-size="12" fill="#000000">Validasi Kredensial Akun</text>

  <!-- Line: Validasi -> Decision Akun Valid -->
  <line x1="590" y1="342" x2="590" y2="372" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. Decision: Akun Valid? (Sistem) -->
  <polygon points="590,374 670,410 590,446 510,410" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="590" y="407" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#000000">Akun</text>
  <text x="590" y="422" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#000000">Valid?</text>

  <!-- Line Decision -> Tidak (Loop back to Input Login) -->
  <path d="M 510 410 L 210 410 L 210 280" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="402" font-size="11" font-weight="bold" fill="#000000">Tidak</text>

  <!-- Line Decision -> Ya (Ke Tampilkan Dashboard Guru) -->
  <path d="M 590 446 L 590 480 L 210 480 L 210 515" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="596" y="465" font-size="11" font-weight="bold" fill="#000000">Ya</text>

  <!-- 5. Tampil Dashboard Guru -->
  <rect x="110" y="517" width="200" height="45" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="210" y="544" text-anchor="middle" font-size="12" fill="#000000">Dashboard Tenaga Pendidik</text>

  <!-- Line: Dashboard -> Decision Jenis Presensi -->
  <line x1="210" y1="562" x2="210" y2="595" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 6. Decision: Pilih Jenis Kehadiran (Guru) -->
  <polygon points="210,597 295,635 210,673 125,635" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="210" y="631" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Pilih Jenis</text>
  <text x="210" y="646" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Kehadiran?</text>

  <!-- ==================== CABANG 1: IZIN / SAKIT ==================== -->
  <!-- Path to Izin/Sakit (Kiri) -->
  <path d="M 125 635 L 75 635 L 75 700" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="80" y="625" font-size="10.5" font-weight="bold" fill="#000000">Izin/Sakit</text>

  <!-- Input Form Izin (Parallelogram) -->
  <polygon points="45,702 180,702 155,752 20,752" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="100" y="723" text-anchor="middle" font-size="10.5" fill="#000000">Input Keterangan</text>
  <text x="100" y="738" text-anchor="middle" font-size="10" fill="#333333">&amp; Upload Surat</text>

  <!-- Line to Simpan Izin di Sistem -->
  <path d="M 100 752 L 100 790 L 490 790" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Simpan Data Izin (Sistem) -->
  <rect x="490" y="768" width="200" height="44" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="590" y="794" text-anchor="middle" font-size="11.5" fill="#000000">Simpan Data Pengajuan Izin</text>

  <!-- Line: Simpan Izin -> Notifikasi ke Admin -->
  <path d="M 690 790 L 840 790" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Admin Verifikasi Izin -->
  <rect x="840" y="768" width="180" height="44" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="930" y="794" text-anchor="middle" font-size="11" fill="#000000">Verifikasi &amp; Approval Izin</text>

  <!-- ==================== CABANG 2: HADIR ==================== -->
  <!-- Path to Hadir (Bawah) -->
  <line x1="210" y1="673" x2="210" y2="825" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="216" y="695" font-size="11" font-weight="bold" fill="#000000">Hadir</text>

  <!-- 7. Scan QR / Selfie (Guru) -->
  <rect x="110" y="827" width="200" height="45" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="210" y="847" text-anchor="middle" font-size="11" fill="#000000">Scan QR Code Sekolah</text>
  <text x="210" y="862" text-anchor="middle" font-size="10.5" fill="#333333">atau Ambil Foto Selfie</text>

  <!-- Line: Scan -> Input GPS -->
  <line x1="210" y1="872" x2="210" y2="902" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 8. Input GPS Koordinat (Parallelogram) -->
  <polygon points="120,904 315,904 285,950 90,950" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="202" y="924" text-anchor="middle" font-size="11" fill="#000000">Deteksi Koordinat GPS HP</text>
  <text x="202" y="939" text-anchor="middle" font-size="10" fill="#333333">(Latitude, Longitude)</text>

  <!-- Line: GPS -> Sistem Cek Radius -->
  <path d="M 300 927 L 590 927 L 590 965" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 9. Decision: Radius Sekolah <= 50m? (Sistem) -->
  <polygon points="590,967 685,1005 590,1043 495,1005" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="590" y="1001" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Radius GPS</text>
  <text x="590" y="1016" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">&lt;= 50 Meter?</text>

  <!-- Radius Tidak (Ditolak) -->
  <path d="M 495 1005 L 430 1005 L 430 1060" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="445" y="998" font-size="10.5" font-weight="bold" fill="#000000">Tidak</text>

  <!-- Output Error (Parallelogram) -->
  <polygon points="390,1062 525,1062 495,1108 360,1108" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="442" y="1082" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#000000">Presensi Ditolak</text>
  <text x="442" y="1096" text-anchor="middle" font-size="9.5" fill="#333333">(Di Luar Radius)</text>

  <!-- Radius Ya (Cek Jam Masuk) -->
  <line x1="590" y1="1043" x2="590" y2="1080" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="596" y="1062" font-size="11" font-weight="bold" fill="#000000">Ya</text>

  <!-- 10. Decision: Cek Jam Masuk (Sistem) -->
  <polygon points="590,1082 685,1120 590,1158 495,1120" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="590" y="1116" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Waktu Masuk &lt;=</text>
  <text x="590" y="1131" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Batas Masuk?</text>

  <!-- Cabang Tepat Waktu -->
  <path d="M 495 1120 L 450 1120 L 450 1175" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="456" y="1112" font-size="10.5" font-weight="bold" fill="#000000">Ya</text>
  <rect x="385" y="1177" width="130" height="38" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="450" y="1195" text-anchor="middle" font-size="10.5" fill="#000000">Status Kehadiran:</text>
  <text x="450" y="1208" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#000000">"Tepat Waktu"</text>

  <!-- Cabang Terlambat -->
  <path d="M 685 1120 L 730 1120 L 730 1175" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="695" y="1112" font-size="10.5" font-weight="bold" fill="#000000">Tidak</text>
  <rect x="665" y="1177" width="130" height="38" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="730" y="1195" text-anchor="middle" font-size="10.5" fill="#000000">Status Kehadiran:</text>
  <text x="730" y="1208" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#000000">"Terlambat"</text>

  <!-- Konvergensi ke Simpan Database -->
  <path d="M 450 1215 L 450 1250 L 590 1250" fill="none" stroke="#000000" stroke-width="1.5"/>
  <path d="M 730 1215 L 730 1250 L 590 1250" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line x1="590" y1="1250" x2="590" y2="1275" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 11. Proses Simpan Database (Sistem) -->
  <rect x="490" y="1277" width="200" height="46" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="590" y="1298" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#000000">Simpan Data Presensi</text>
  <text x="590" y="1313" text-anchor="middle" font-size="10.5" fill="#333333">ke Database Cloud (MySQL)</text>

  <!-- Line: Simpan DB -> Notifikasi ke Guru -->
  <path d="M 490 1300 L 210 1300 L 210 1345" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 12. Output Notifikasi Berhasil (Guru) -->
  <polygon points="120,1347 315,1347 285,1393 90,1393" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="202" y="1367" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Tampilkan Bukti Presensi</text>
  <text x="202" y="1382" text-anchor="middle" font-size="10" fill="#333333">&amp; Riwayat Kehadiran</text>

  <!-- ==================== FLOW ADMIN ==================== -->
  <!-- Admin Start Login -->
  <polygon points="850,224 1025,224 1000,274 825,274" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="925" y="246" text-anchor="middle" font-size="11.5" fill="#000000">Login Administrator</text>
  <text x="925" y="262" text-anchor="middle" font-size="10.5" fill="#333333">(Email &amp; Password)</text>

  <line x1="925" y1="274" x2="925" y2="305" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="840" y="307" width="170" height="44" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="925" y="327" text-anchor="middle" font-size="11" fill="#000000">Dashboard Monitoring</text>
  <text x="925" y="342" text-anchor="middle" font-size="10" fill="#333333">Kehadiran Realtime</text>

  <line x1="925" y1="351" x2="925" y2="385" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="840" y="387" width="170" height="58" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="925" y="407" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Manajemen Master:</text>
  <text x="925" y="423" text-anchor="middle" font-size="10" fill="#333333">• Data Tenaga Pendidik</text>
  <text x="925" y="437" text-anchor="middle" font-size="10" fill="#333333">• Setting GPS &amp; Jam Masuk</text>

  <!-- Line: Admin Laporan -->
  <path d="M 930 812 L 930 1345" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output Laporan Admin (Parallelogram) -->
  <polygon points="845,1347 1030,1347 1005,1393 820,1393" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="925" y="1367" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Cetak Laporan Rekapitulasi</text>
  <text x="925" y="1382" text-anchor="middle" font-size="10" fill="#333333">(Format PDF / Excel)</text>

  <!-- ==================== SELESAI ==================== -->
  <!-- Convergence Lines to Finish -->
  <path d="M 210 1393 L 210 1450 L 590 1450" fill="none" stroke="#000000" stroke-width="1.5"/>
  <path d="M 442 1108 L 442 1450" fill="none" stroke="#000000" stroke-width="1.5"/>
  <path d="M 925 1393 L 925 1450 L 590 1450" fill="none" stroke="#000000" stroke-width="1.5"/>

  <line x1="590" y1="1450" x2="590" y2="1490" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Selesai (Terminator) -->
  <rect x="515" y="1492" width="150" height="42" rx="21" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="590" y="1518" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Selesai</text>

  <!-- Academic Caption Below -->
  <text x="550" y="1600" text-anchor="middle" font-size="11.5" font-style="italic" fill="#333333">Gambar 3.x Flowchart Alur Kerja Sistem Presensi PKBM Ibadurrahman (Standar ANSI/ISO 5807)</text>
</svg>
